
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Generator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: #1a1a2e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #5750d4;
    }

    .image-box {
      margin-top: 20px;
      min-height: 200px;
      background: #111;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .loading {
      display: none;
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>AI Image Generator</h1>

    <input id="prompt" placeholder="Type your prompt..." />

    <button onclick="generateImage()">Generate</button>

    <div class="loading" id="loading">Generating image...</div>

    <div class="image-box">
      <img id="result" />
    </div>
  </div>

  <script>
    function generateImage() {
      const prompt = document.getElementById("prompt").value;
      const img = document.getElementById("result");
      const loading = document.getElementById("loading");

      if (!prompt) return alert("Type a prompt first");

      loading.style.display = "block";
      img.src = "";

      // Demo placeholder (we will replace with real AI next)
      setTimeout(() => {
        img.src = "https://picsum.photos/512?random=" + Math.random();
        loading.style.display = "none";
      }, 2000);
    }
  </script>

</body>
</html>
